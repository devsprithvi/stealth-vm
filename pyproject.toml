[project]
name = "svm"
version = "0.1.0"
description = "Disposable, stealth-configured QEMU virtual machines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
svm = "svm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svm"]

[tool.uv]
package = true
