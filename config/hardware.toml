# Shared pools -------------------------------------------------------------
#
# Memory sizes must match a profile's resources.memory_mb exactly. The guest
# sees one DIMM whose size equals the VM's RAM (QEMU builds type 17 itself).

[[memory]]
manufacturer = "Corsair"
part = "CMK8GX4M1E3200C16"
speed = 3200
size_mb = 8192

[[memory]]
manufacturer = "G.Skill"
part = "F4-3200C16S-8GVKB"
speed = 3200
size_mb = 8192

[[memory]]
manufacturer = "Kingston"
part = "KF3200C16D4/8GX"
speed = 3200
size_mb = 8192

[[memory]]
manufacturer = "Corsair"
part = "CMK4GX4M1E3200C16"
speed = 3200
size_mb = 4096

[[memory]]
manufacturer = "G.Skill"
part = "F4-3200C16S-4GVKB"
speed = 3200
size_mb = 4096

[[memory]]
manufacturer = "Kingston"
part = "KF3200C16D4/4GX"
speed = 3200
size_mb = 4096

# Disk capacity is the decimal GB printed on the drive label, and must match
# a profile's resources.disk_gb exactly. A 500 GB SSD is a normal desktop disk;
# the guest therefore sees ~465.7 GiB, not 500 GiB. qcow2 keeps it sparse.
[[disks]]
model = "Samsung SSD 870 EVO 500GB"
capacity_gb = 500
serial_prefix = "S3Y8NB0K"
firmware = "SVT02B6Q"

[[disks]]
# Full ATA model string. Linux's sysfs `model` attribute truncates ATA model
# names to 16 characters, exactly as it does on a real WD drive; udev's
# ID_MODEL and the ATA IDENTIFY data keep the full string.
model = "WDC WDS500G2B0A-00SM50"
capacity_gb = 500
serial_prefix = "WD-WCC4E"
firmware = "411040WD"

[[disks]]
model = "CT500MX500SSD1"
capacity_gb = 500
serial_prefix = "2020E4"
firmware = "M3CR045"

# Kept for older 250 GB bases; new profiles use the 500 GB entries above.
[[disks]]
model = "Samsung SSD 870 EVO 250GB"
capacity_gb = 250
serial_prefix = "S3Y8NB0K"
firmware = "SVT02B6Q"

[[disks]]
model = "WDC WDS250G2B0A-00SM50"
capacity_gb = 250
serial_prefix = "WD-WCC4E"
firmware = "411040WD"

[[disks]]
model = "CT250MX500SSD1"
capacity_gb = 250
serial_prefix = "2020E4"
firmware = "M3CR045"

# Real, unicast, globally-administered OUIs. Avoid 52:54:00, 00:0C:29,
# 00:50:56, 08:00:27, 00:1C:42, 00:15:5D (hypervisor ranges).
