# Hardware identity pools.
#
# The generator picks a CPU whose thread count matches the profile's vCPU
# count, a memory kit whose size matches the profile's RAM, a disk whose
# capacity matches the profile's disk, and a MAC OUI. Every value must be
# self-consistent: a guest that sees 8 GiB of RAM must also see an 8 GiB DIMM.
#
# The host is AMD, so the AMD pool is used by default. The q35 machine model
# still exposes Intel chipset PCI IDs; that is a known limitation for very
# deep hardware-consistency checks (see docs/ARCHITECTURE.md).

[amd]
cpu_manufacturer = "Advanced Micro Devices, Inc."
socket = "AM4"

[[amd.cpus]]
name = "AMD Ryzen 3 1200 4-Core Processor"
family = 23          # 0x17, Zen
model = 1
stepping = 1
cores = 4
threads = 4
base_speed = 3100
max_speed = 3400
processor_family = 107   # 0x6B, AMD Zen
processor_upgrade = 0x31
l1_cache_kb = 256
l2_cache_kb = 2048
l3_cache_kb = 8192

[[amd.cpus]]
name = "AMD Ryzen 3 3100 4-Core Processor"
family = 23          # 0x17, Zen 2
model = 113          # 0x71, Matisse
stepping = 0
cores = 4
threads = 8
base_speed = 3600
max_speed = 3900
processor_family = 108   # 0x6C, AMD Zen 2
processor_upgrade = 0x31
l1_cache_kb = 256
l2_cache_kb = 2048
l3_cache_kb = 16384

[[amd.cpus]]
# Renoir, no integrated graphics. The generator prefers this entry on hosts
# whose CPUID family/model matches, so the guest's microcode revision (passed
# through by KVM) stays consistent with the emulated CPU model.
name = "AMD Ryzen 3 4100 4-Core Processor"
family = 23          # 0x17, Zen 2
model = 96           # 0x60, Renoir
stepping = 1
cores = 4
threads = 8
base_speed = 3800
max_speed = 4000
processor_family = 107   # host firmware reports Zen for this Renoir part
processor_upgrade = 0x31
l1_cache_kb = 256
l2_cache_kb = 2048
l3_cache_kb = 4096

[[amd.cpus]]
# The host CPU.  Matching family/model/stepping keeps KVM's microcode revision
# consistent with the advertised model; the cache sizes match the host DMI.
name = "AMD Ryzen 5 4500 6-Core Processor"
family = 23          # 0x17, Zen 2
model = 96           # 0x60, Renoir
stepping = 1
cores = 6
threads = 12
base_speed = 3600
max_speed = 4200
processor_family = 107   # host firmware reports Zen (0x6B)
processor_upgrade = 0x31
l1_cache_kb = 384
l2_cache_kb = 3072
l3_cache_kb = 8192

[[amd.cpus]]
name = "AMD Ryzen 5 3500 6-Core Processor"
family = 23
model = 113
stepping = 0
cores = 6
threads = 6
base_speed = 3600
