# Ubuntu desktop guest. The 8 GiB memory and 500 GB (decimal) disk sizes
# match entries in hardware.toml. 500 GB is the labelled capacity of the
# emulated SSD; the guest correctly sees ~465.7 GiB.
#
# 12 vCPUs = the host's thread count, which selects the Ryzen 5 4500 identity
# (6C/12T). That is the only identity whose cache sizes match the host CPU, so
# CPUID cache leaves and the SMBIOS cache tables agree. Use fewer vCPUs only if
# you accept a cache-size mismatch (see docs/ANTI-DETECTION.md).
#
# Input is PS/2, not USB HID. q35 provides an i8042 controller, so the guest
# reports a normal PS/2 keyboard and mouse instead of a QEMU USB tablet.

os = "linux"
base = "linux"

# Disposable like every other profile: each launch is a new machine and the
# session is wiped when the viewer closes. Keep one on purpose with
# `svm run --fresh --keep`, then reopen it with `svm run <id>`.

[resources]
vcpus = 12
memory_mb = 8192
disk_gb = 500

[display]
audio = true
xres = 1920
yres = 1080

[input]
mode = "ps2"

[network]
nic = "e1000e"

[hardware]
secure_boot = false
tpm = false
